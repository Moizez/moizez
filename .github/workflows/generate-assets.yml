# Copie para .github/workflows/generate-assets.yml NO REPOSITÓRIO DO PERFIL (Moizez/moizez).
# Ele não roda aqui — este repositório só guarda o arquivo para que a correção não se perca.
#
# Substitui o main.yml antigo, que tinha três problemas:
#
#   1. cron "* */12 * * *" não é "a cada 12 horas". O primeiro campo é o minuto, e um asterisco
#      ali significa *todo* minuto — ou seja, 60 execuções por hora, duas vezes por dia, 120 no
#      total. "0 */12 * * *" é o que se queria dizer.
#   2. Platane/snk@master seguia o branch default da action; @v3 fixa a versão, e a variante
#      svg-only evita gerar o GIF que ninguém usa.
#   3. Gerava só o SVG claro. O -dark permite o <picture> no README, que troca conforme o tema
#      de quem lê. Depois que este workflow rodar uma vez, ligue snakeDark em profile/config.mjs.

name: Gerar imagens do perfil

on:
  schedule:
    # Meia-noite e meio-dia UTC. O GitHub enfileira cron de repositório público com atraso de
    # alguns minutos — é esperado, não é falha.
    - cron: '0 */12 * * *'
  workflow_dispatch:

# O padrão do GITHUB_TOKEN é somente leitura desde 2023. Sem isto o push para o branch output
# falha com 403 — e falha no fim do job, depois de a geração ter dado certo, que é o jeito mais
# confuso possível de descobrir o problema.
permissions:
  contents: write

jobs:
  generate:
    name: Cobrinha das contribuições
    runs-on: ubuntu-latest

    steps:
      - name: Gerar os SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
